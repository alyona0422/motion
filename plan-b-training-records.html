<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 训练记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-training-records.css" />
</head>
<body data-plan-b-page="training-records">
  <main class="device-shell" aria-label="Plan B 训练记录">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="content tr-screen" id="trainingRecordsScreen" aria-label="全部训练记录">
      <div class="tr-app">
        <header class="tr-header">
          <button class="tr-back-btn" id="trainingRecordsBackBtn" type="button" aria-label="返回我的">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            <span>返回</span>
          </button>
          <div class="tr-header-copy">
            <p class="tr-kicker">训练分析</p>
            <h1>全部训练记录</h1>
          </div>
          <div class="tr-range-switch" role="tablist" aria-label="时间范围">
            <button class="tr-range-btn is-active" type="button" data-range="week" role="tab" aria-selected="true">周统计</button>
            <button class="tr-range-btn" type="button" data-range="month" role="tab" aria-selected="false">月统计</button>
            <button class="tr-range-btn" type="button" data-range="all" role="tab" aria-selected="false">全部训练</button>
          </div>
        </header>

        <div id="trChartsView">
          <section class="tr-card" aria-label="训练容量趋势">
            <div class="tr-card-head">
              <h2>训练容量</h2>
              <p>柱状为训练总量，折线为平均趋势</p>
            </div>
            <div class="tr-chart-wrap">
              <div class="tr-chart" id="volumeChart" role="img" aria-label="训练容量趋势图"></div>
              <div class="tr-empty-overlay" id="volumeEmptyOverlay" hidden>
                <strong>暂无训练记录</strong>
                <span>完成更多力量训练解锁该图表吧！</span>
              </div>
            </div>
          </section>

          <section class="tr-card" aria-label="AI动作评分趋势">
            <div class="tr-card-head">
              <h2>AI动作评分</h2>
              <p>所选周期内评分趋势</p>
            </div>
            <div class="tr-chart-wrap">
              <div class="tr-chart" id="qualityChart" role="img" aria-label="AI质量趋势图"></div>
              <div class="tr-empty-overlay" id="qualityEmptyOverlay" hidden>
                <strong>暂无AI动作评分数据</strong>
                <span>完成更多AI动作解锁该图表吧！</span>
              </div>
            </div>
          </section>

          <section class="tr-card" aria-label="训练结构分析">
            <div class="tr-card-head">
              <h2>训练结构分布</h2>
              <p>训练类型与场景分布</p>
            </div>
            <div class="tr-ring-grid">
              <div class="tr-ring-card">
                <h3>来源占比</h3>
                <div class="tr-ring" id="sourceChart" role="img" aria-label="训练来源占比图"></div>
              </div>
              <div class="tr-ring-card">
                <h3>模式占比</h3>
                <div class="tr-ring" id="modeChart" role="img" aria-label="训练模式占比图"></div>
              </div>
            </div>
          </section>

          <section class="tr-card" aria-label="身体刺激分布图">
            <div class="tr-card-head">
              <h2>训练肌肉热力图</h2>
              <p>下方统计来自已完成动作训练的肌肉数据。</p>
            </div>
            <div class="tr-body-map" id="bodyMapRoot">
              <figure class="tr-body-figure">
                <figcaption>正面</figcaption>
                <svg class="tr-body-svg" viewBox="0 0 120 220" aria-label="正面身体图">
                  <path class="tr-body-outline" d="M60 10c11 0 20 9 20 20 0 8-5 15-11 18l2 13 10 15-3 53-10 12v26h-16v-26l-10-12-3-53 10-15 2-13c-6-3-11-10-11-18 0-11 9-20 20-20z"/>
                  <path id="chest" class="tr-muscle-zone" d="M45 67h30v24H45z"/>
                  <path id="core" class="tr-muscle-zone" d="M48 93h24v34H48z"/>
                  <path id="arms" class="tr-muscle-zone" d="M33 78h10v40H33zm44 0h10v40H77z"/>
                  <path id="glutes" class="tr-muscle-zone" d="M47 127h26v16H47z"/>
                  <path id="legs" class="tr-muscle-zone" d="M44 144h13v46H44zm19 0h13v46H63z"/>
                </svg>
              </figure>
              <figure class="tr-body-figure">
                <figcaption>背面</figcaption>
                <svg class="tr-body-svg" viewBox="0 0 120 220" aria-label="背面身体图">
                  <path class="tr-body-outline" d="M60 10c11 0 20 9 20 20 0 8-5 15-11 18l2 13 10 15-3 53-10 12v26h-16v-26l-10-12-3-53 10-15 2-13c-6-3-11-10-11-18 0-11 9-20 20-20z"/>
                  <path id="back" class="tr-muscle-zone" d="M45 67h30v48H45z"/>
                  <path id="rearShoulders" class="tr-muscle-zone" d="M36 68h11v24H36zm37 0h11v24H73z"/>
                  <path id="hamstrings" class="tr-muscle-zone" d="M44 144h13v46H44zm19 0h13v46H63z"/>
                </svg>
              </figure>
            </div>
          </section>
        </div>

        <section class="tr-card tr-history-card" id="trListView" aria-label="训练历史列表" hidden>
          <div class="tr-card-head tr-history-head">
            <h2>全部训练</h2>
            <button class="tr-clear-filter" id="clearChartFilterBtn" type="button" hidden>清除筛选</button>
          </div>
          <div class="tr-filter-indicator" id="activeFilterHint" hidden></div>
          <div class="tr-history-list" id="historyListContainer"></div>
          <p class="tr-empty-list" id="historyEmpty" hidden>当前筛选条件下暂无记录。</p>
        </section>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item" id="homeTabBtn" type="button" aria-label="首页">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </span>
      </button>
      <button class="nav-item" id="allTrainingNavBtn" type="button" aria-label="全部训练">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>全部训练</span>
        </span>
      </button>
      <button class="nav-item active" id="profileTabBtn" type="button" aria-label="我的">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </span>
      </button>
    </nav>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="js/data/explore-library.js"></script>
  <script src="js/plan-b-verify.js" defer></script>
  <script src="js/plan-b-training-records.js" defer></script>
  <script>
    window.__DEV_BACKUP__ = { apiOrigin: 'http://127.0.0.1:37547' };
  </script>
  <script src="http://127.0.0.1:37547/widget.js" defer></script>
</body>
</html>
