<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 氛围灯设置</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-ambient-light.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
</head>
<body class="cream-medium" data-plan-b-page="ambient-light-settings">
  <main class="device-shell" aria-label="氛围灯设置">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="settings-screen" aria-label="氛围灯设置">
      <div class="top-status-row">
        <div class="status-pill">
          <div class="status-time">
            <span>上午 10:26</span>
            <small>2024年12月6日</small>
          </div>
          <div class="status-icons">
            <span class="status-chip">蓝牙</span>
            <span class="status-chip">85%</span>
          </div>
        </div>
      </div>

      <div class="settings-header">
        <h1 class="settings-title">氛围灯设置</h1>
      </div>

      <div class="settings-content">
        <article class="setting-card card-power">
          <div class="setting-row">
            <div>
              <h2 class="card-title">氛围灯</h2>
              <p class="card-subtitle">开启或关闭氛围灯。</p>
            </div>
            <button class="toggle-btn" id="ambientPowerToggle" type="button" role="switch" aria-checked="false" aria-label="氛围灯开关">
              <span class="toggle-knob"></span>
            </button>
          </div>
        </article>

        <div id="featureGroup">
          <article class="setting-card">
            <div class="setting-row">
              <div>
                <h2 class="card-title">颜色</h2>
                <p class="card-subtitle">预设颜色与色板取色。</p>
              </div>
              <span class="badge">7 预设 + 3 自定义</span>
            </div>

            <div class="preset-grid" id="presetGrid">
              <button class="preset-chip" type="button" data-color="#ffffff" data-name="白色"><span class="chip-dot" style="--chip-color:#ffffff;"></span>白色</button>
              <button class="preset-chip" type="button" data-color="#3b82f6" data-name="蓝色"><span class="chip-dot" style="--chip-color:#3b82f6;"></span>蓝色</button>
              <button class="preset-chip" type="button" data-color="#8b5cf6" data-name="紫色"><span class="chip-dot" style="--chip-color:#8b5cf6;"></span>紫色</button>
              <button class="preset-chip" type="button" data-color="#ec4899" data-name="粉色"><span class="chip-dot" style="--chip-color:#ec4899;"></span>粉色</button>
              <button class="preset-chip" type="button" data-color="#ef4444" data-name="红色"><span class="chip-dot" style="--chip-color:#ef4444;"></span>红色</button>
              <button class="preset-chip" type="button" data-color="#f97316" data-name="橙色"><span class="chip-dot" style="--chip-color:#f97316;"></span>橙色</button>
              <button class="preset-chip" type="button" data-color="#22c55e" data-name="绿色"><span class="chip-dot" style="--chip-color:#22c55e;"></span>绿色</button>
              <button class="preset-chip custom-chip" type="button" data-index="0"><span class="chip-dot is-empty"></span>自定义一</button>
              <button class="preset-chip custom-chip" type="button" data-index="1"><span class="chip-dot is-empty"></span>自定义二</button>
              <button class="preset-chip custom-chip" type="button" data-index="2"><span class="chip-dot is-empty"></span>自定义三</button>
            </div>
            <p class="color-grid-tip">长按已设置的自定义色可清除</p>

            <div class="board-row">
              <label class="field-label" for="colorBoardInput">色板</label>
              <div class="board-controls">
                <input id="colorBoardInput" class="color-board-input" type="color" value="#ffffff" aria-label="色板取色" />
                <button id="addFavoriteBtn" class="secondary-btn" type="button">保存到自定义</button>
              </div>
            </div>
          </article>

          <article class="setting-card">
            <div class="setting-row">
              <div>
                <h2 class="card-title">亮度</h2>
                <p class="card-subtitle">手动调节亮度 0%–100%。</p>
              </div>
              <span class="value-pill"><span id="brightnessValue">60</span>%</span>
            </div>

            <label class="field-label" for="brightnessSlider">手动亮度</label>
            <input id="brightnessSlider" class="range-slider" type="range" min="0" max="100" step="1" value="60" />

            <div class="setting-row">
              <div>
                <h3 class="row-title">自动亮度</h3>
                <p class="row-note">根据环境光自动调节亮度。</p>
              </div>
              <button class="toggle-btn" id="autoBrightnessToggle" type="button" role="switch" aria-checked="false" aria-label="自动亮度">
                <span class="toggle-knob"></span>
              </button>
            </div>
          </article>

          <article class="setting-card">
            <div class="setting-row">
              <div>
                <h2 class="card-title">模式</h2>
                <p class="card-subtitle">选择常亮或呼吸模式。</p>
              </div>
            </div>
            <div class="segmented" id="modeSegment">
              <button class="segment-btn is-active" type="button" data-mode="steady">常亮</button>
              <button class="segment-btn" type="button" data-mode="breathing">呼吸</button>
            </div>

            <div id="breathingSpeedGroup" class="breathing-group is-hidden">
              <label class="field-label">呼吸速度</label>
              <div class="segmented">
                <button class="segment-btn is-active" type="button" data-speed="medium">中（5秒）</button>
                <button class="segment-btn" type="button" data-speed="slow">慢（10秒）</button>
                <button class="segment-btn" type="button" data-speed="fast">快（2秒）</button>
              </div>
            </div>
          </article>

          <article class="setting-card">
            <div class="setting-row">
              <div>
                <h2 class="card-title">音乐律动</h2>
                <p class="card-subtitle">灯光随音乐节奏同步变化。</p>
              </div>
              <button class="toggle-btn" id="musicSyncToggle" type="button" role="switch" aria-checked="false" aria-label="音乐律动">
                <span class="toggle-knob"></span>
              </button>
            </div>
          </article>

          <article class="setting-card">
            <div class="setting-row">
              <div>
                <h2 class="card-title">训练律动</h2>
                <p class="card-subtitle">灯光随发力或动作幅度同步变化。</p>
              </div>
              <button class="toggle-btn" id="trainingSyncToggle" type="button" role="switch" aria-checked="false" aria-label="训练律动">
                <span class="toggle-knob"></span>
              </button>
            </div>
          </article>
        </div>

        <div class="reset-defaults-wrap">
          <button class="reset-defaults-btn" type="button" id="resetDefaultsBtn">恢复默认设置</button>
          <p class="reset-defaults-note">将所有氛围灯选项恢复为出厂默认值。</p>
        </div>
      </div>
      <div class="action-dock" aria-label="页面操作">
        <button class="settings-back-btn" type="button" onclick="window.location.href='plan-b-device-settings.html'" aria-label="返回设备设置">
          <svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </button>
      </div>
    </section>

    <div class="training-modal" id="resetDefaultsModal" aria-hidden="true">
      <div class="modal-panel reset-modal-panel" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
        <div class="modal-head">
          <h3 id="resetModalTitle">恢复默认设置</h3>
          <button class="close-btn" id="closeResetModalBtn" type="button" aria-label="关闭">✕</button>
        </div>
        <p class="reset-modal-copy">确定将所有氛围灯设置恢复为出厂默认值吗？当前自定义颜色与开关状态将被清除。</p>
        <div class="reset-modal-actions">
          <button class="secondary-btn reset-modal-cancel" type="button" id="cancelResetBtn">取消</button>
          <button class="resume-btn reset-modal-confirm" type="button" id="confirmResetBtn">确定恢复</button>
        </div>
      </div>
    </div>
  </main>
  <script src="js/plan-b-ambient-light-settings.js"></script>
  <script>
    window.__DEV_BACKUP__ = { apiOrigin: 'http://127.0.0.1:37547' };
  </script>
  <script src="http://127.0.0.1:37547/widget.js" defer></script>
</body>
</html>
