<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 我的</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
</head>
<body class="cream-medium" data-plan-b-page="profile">
  <main class="device-shell" aria-label="Plan B 我的">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="profile-screen active" id="profileScreen" aria-hidden="false" aria-label="我的">
      <!-- Profile Header -->
      <div class="pr-header">
        <div class="pr-user-info">
          <div class="pr-avatar">A</div>
          <div class="pr-user-meta">
            <div class="pr-user-details">
               <h1>Alyona</h1>
               <p>2026 年加入</p>
            </div>
          </div>
        </div>
        <div class="pr-total-days">
           <div class="label">累计训练</div>
           <div class="value">42 <small>天</small></div>
        </div>
      </div>

      <!-- Last 7 Days Overview -->
      <section>
        <h3 class="pr-section-title">近 7 天</h3>
        <div class="pr-stats-grid">
           <!-- Workouts -->
           <div class="pr-stat-card glass">
              <div class="pr-stat-icon white">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              </div>
              <div class="pr-stat-info">
                 <small>训练次数</small>
                 <strong>4 <span class="unit">次</span></strong>
              </div>
           </div>
           
           <!-- Duration -->
           <div class="pr-stat-card blue-gradient">
              <div class="pr-stat-icon blue">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </div>
              <div class="pr-stat-info">
                 <small>时长</small>
                 <strong>195 <span class="unit">分钟</span></strong>
              </div>
           </div>
           
           <!-- Calories -->
           <div class="pr-stat-card orange-gradient">
              <div class="pr-stat-icon orange">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
              </div>
              <div class="pr-stat-info">
                 <small>消耗</small>
                 <strong>1,840 <span class="unit">kcal</span></strong>
              </div>
           </div>
           
           <!-- Volume -->
           <div class="pr-stat-card cyan-gradient">
              <div class="pr-stat-icon cyan">
                 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
              </div>
              <div class="pr-stat-info">
                 <small>总容量</small>
                 <strong>12.4 <span class="unit">吨</span></strong>
              </div>
           </div>
        </div>
      </section>

      <!-- Recent Records -->
      <section>
        <div class="pr-records-header">
           <h3 class="pr-section-title">最近记录</h3>
           <button class="pr-view-all" type="button" onclick="window.location.href='plan-b-training-records.html'">查看全部记录</button>
        </div>
        
        <div class="pr-records-list">
           <!-- Record 1 -->
           <div class="pr-record-item">
               <div class="pr-record-icon blue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
               </div>
               <div class="pr-record-main">
                   <div class="pr-record-title">力量：全身</div>
                   <div class="pr-record-date">今天 上午 08:30</div>
               </div>
               <div class="pr-record-stats">
                 <div class="pr-record-duration">45分钟</div>
                 <div class="pr-record-metric" style="color: var(--blue);">8,200 kg</div>
               </div>
           </div>
           
           <!-- Record 2 -->
           <div class="pr-record-item">
               <div class="pr-record-icon orange">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12c0 6-4.39 10-9.806 10C7.792 22 4.24 17.39 4 12 3.736 5.943 7.828 2 12 2c5.655 0 10 4.225 10 10Z"/><path d="M12 12v-2"/><path d="M12 16v.01"/></svg>
               </div>
               <div class="pr-record-main">
                   <div class="pr-record-title">有氧：划船</div>
                   <div class="pr-record-date">昨天 下午 19:15</div>
               </div>
               <div class="pr-record-stats">
                 <div class="pr-record-duration">30分钟</div>
                 <div class="pr-record-metric" style="color: var(--orange);">420 kcal</div>
               </div>
           </div>
           
           <!-- Record 3 -->
           <div class="pr-record-item">
               <div class="pr-record-icon cyan">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>
               </div>
               <div class="pr-record-main">
                   <div class="pr-record-title">力量：上肢</div>
                   <div class="pr-record-date">3月12日 上午 07:45</div>
               </div>
               <div class="pr-record-stats">
                 <div class="pr-record-duration">60分钟</div>
                 <div class="pr-record-metric" style="color: var(--cyan);">10,500 kg</div>
               </div>
           </div>
        </div>
      </section>

      <!-- Management Settings -->
      <section class="pr-management-section">
        <h3 class="pr-section-title" style="margin-bottom: 8px;">管理</h3>
        
        <div class="pr-actions-grid">
            <button class="pr-action-btn" type="button" onclick="window.location.href='plan-b-device-settings.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
                设备设置
            </button>
            <button class="pr-action-btn" type="button" onclick="window.location.href='plan-b-my-training-plans.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                训练计划
            </button>
        </div>

        <div class="settings-list">
            <button class="list-btn" type="button" onclick="window.location.href='plan-b-account-settings.html'">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                账户设置
            </button>
            <button class="list-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                帮助与反馈
            </button>
        </div>
      </section>

      <div class="action-dock action-dock--above-nav" aria-label="页面操作">
        <button class="pr-logout-btn" id="logoutBtn" type="button">退出登录</button>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item" id="homeTabBtn" type="button" aria-label="首页">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </span>
      </button>
      <button class="nav-item" id="allTrainingNavBtn" type="button" aria-label="全部训练">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>全部训练</span>
        </span>
      </button>
      <button class="nav-item active" id="profileTabBtn" type="button" aria-label="我的">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </span>
      </button>
    </nav>

    <div class="training-modal" id="trainingTypeModal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="trainingTypeTitle">
        <div class="modal-head">
          <h3 id="trainingTypeTitle">选择训练类型</h3>
          <button class="close-btn" id="closeTrainingTypeModal" type="button" aria-label="关闭">✕</button>
        </div>
        <button class="training-btn" id="strengthTrainingBtn" type="button">
          <strong>力量训练</strong>
          <span>自由配重、阻力模式、详细数据</span>
        </button>
        <button class="training-btn" id="pilatesTrainingBtn" type="button">
          <strong>普拉提</strong>
          <span>核心控制与稳定</span>
        </button>
        <button class="training-btn" id="resistanceCardioBtn" type="button">
          <strong>阻力有氧</strong>
          <span>划船、滑雪等带阻力控制的有氧</span>
        </button>
      </div>
    </div>

    <div class="auth-confirm-modal is-hidden" id="logoutConfirmModal" aria-hidden="true">
      <div class="auth-confirm-panel" role="dialog" aria-modal="true" aria-labelledby="logoutConfirmTitle">
        <h3 id="logoutConfirmTitle">确定要退出登录吗？</h3>
        <div class="auth-confirm-actions">
          <button class="auth-confirm-btn auth-confirm-cancel" id="logoutCancelBtn" type="button">取消</button>
          <button class="auth-confirm-btn auth-confirm-ok" id="logoutConfirmBtn" type="button">确认</button>
        </div>
      </div>
    </div>

  </main>
  <script src="js/data/explore-library.js"></script>
  <script src="js/plan-b-verify.js" defer></script>
  <script>
    (function () {
      const logoutBtn = document.getElementById("logoutBtn");
      const modal = document.getElementById("logoutConfirmModal");
      const cancelBtn = document.getElementById("logoutCancelBtn");
      const confirmBtn = document.getElementById("logoutConfirmBtn");

      if (!logoutBtn || !modal || !cancelBtn || !confirmBtn) return;

      const toggleModal = (visible) => {
        modal.classList.toggle("is-hidden", !visible);
        modal.setAttribute("aria-hidden", visible ? "false" : "true");
      };

      logoutBtn.addEventListener("click", () => toggleModal(true));
      cancelBtn.addEventListener("click", () => toggleModal(false));
      modal.addEventListener("click", (event) => {
        if (event.target === modal) toggleModal(false);
      });
      confirmBtn.addEventListener("click", () => {
        window.location.href = "plan-b-login.html";
      });
    })();
  </script>
  <script>
    window.__DEV_BACKUP__ = { apiOrigin: 'http://127.0.0.1:37547' };
  </script>
  <script src="http://127.0.0.1:37547/widget.js" defer></script>
</body>
</html>
