<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B 首页验证 · UX Pro Max</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
  <link rel="stylesheet" href="css/plan-b-control-center.css" />
</head>
<body class="cream-medium" data-plan-b-page="home">
  <main class="device-shell" aria-label="Plan B 首页验证">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="content" id="homeScreen">
      <div class="top-status-row" id="controlCenterHandle" role="button" tabindex="0" aria-label="打开控制中心">
        <div class="status-pill">
          <div class="status-time">
            <span>上午 10:26</span>
            <small>2024年12月6日</small>
          </div>
          <div class="status-icons">
            <span class="status-chip">Wi</span>
            <span class="status-chip">Bt</span>
            <span class="status-chip">85%</span>
          </div>
        </div>
      </div>

      <div class="user-row">
        <div class="user-meta">
          <div class="avatar">A</div>
          <div class="user-text">
            <h1>Alyona</h1>
            <p>竞赛模式 · 第 1 周</p>
          </div>
        </div>
        <div class="week-strip">
          <div class="day-chip"><span>一</span><strong>12</strong></div>
          <div class="day-chip"><span>二</span><strong>13</strong></div>
          <div class="day-chip"><span>三</span><strong>14</strong></div>
          <div class="day-chip"><span>四</span><strong>15</strong></div>
          <div class="day-chip day-chip--active"><span>五</span><strong>16</strong></div>
          <div class="day-chip"><span>六</span><strong>17</strong></div>
          <div class="day-chip"><span>日</span><strong>18</strong></div>
        </div>
      </div>

      <section class="weekly-card" aria-label="当日训练数据">
        <div class="dial">
          <div class="dial-inner"></div>
          <div class="dial-center">
            <span>当日</span>
            <strong>68%</strong>
          </div>
        </div>
        <div class="weekly-metrics">
          <div class="weekly-metric">
            <label>消耗</label>
            <div class="value">375<small>卡</small></div>
            <p>+12% 较昨日</p>
          </div>
          <div class="weekly-metric">
            <label>时长</label>
            <div class="value">19<small>分钟</small></div>
            <p>+5% 较昨日</p>
          </div>
          <div class="weekly-metric">
            <label>频次</label>
            <div class="value">2<small>天</small></div>
            <p>与昨日持平</p>
          </div>
        </div>
      </section>

      <section class="resume-card" aria-label="开始自由训练">
        <div>
          <strong>开始自由训练</strong>
          <p>选择训练类型，随时开始一次新的自由训练。</p>
        </div>
        <button class="resume-btn" id="startTrainingModalBtn" type="button">开始训练</button>
      </section>

      <section class="today-plan-card" id="todayPlanReminder" aria-label="今日训练提醒">
        <div class="today-plan-copy">
          <small>今日计划提醒</small>
          <strong id="todayPlanTitle">今日计划</strong>
          <p id="todayPlanSubtitle">正在查询你加入的计划…</p>
        </div>
        <div class="today-plan-list" id="todayPlanList" aria-live="polite"></div>
        <button class="resume-btn today-plan-btn" id="todayPlanActionBtn" type="button">开始训练</button>
      </section>

      <section class="banner" id="featuredPlanBanner" role="button" tabindex="0" aria-label="打开“精益力量 21”计划详情">
        <div class="banner-content">
          <div>
            <small id="featuredPlanType">力量训练</small>
            <h2 id="featuredPlanTitle">精益力量 21</h2>
          </div>
        </div>
      </section>

      <section class="explore-section" aria-label="首页探索">
        <aside class="sidebar">
          <small>探索</small>
          <button class="side-tab active" type="button" data-category="plans">
            <strong>计划</strong>
            <span>按时长</span>
          </button>
          <button class="side-tab" type="button" data-category="aiMoves">
            <strong>AI 动作</strong>
            <span>智能推荐</span>
          </button>
          <button class="side-tab" type="button" data-category="moves">
            <strong>动作</strong>
            <span>按肌群</span>
          </button>
        </aside>

        <div class="explore-main">
          <div class="explore-head">
            <h3 id="exploreTitle">计划</h3>
            <div class="filters">
              <button class="filter-tab active" type="button" data-filter="recommended" aria-label="推荐">推荐</button>
              <button class="filter-tab" type="button" data-filter="personalized" aria-label="个性化">个性化</button>
            </div>
          </div>
          <div class="grid-wrap">
            <div class="grid" id="exploreGrid"></div>
          </div>
        </div>
      </section>
    </section>

    <section class="control-center" id="controlCenter" aria-label="控制中心">
      <div class="cc-scrim" id="controlCenterScrim" aria-hidden="true"></div>
      <div class="cc-panel" id="controlCenterPanel">
        <div class="cc-dragger" id="controlCenterDrag" aria-hidden="true"></div>
        <div class="cc-grid">
          <article class="cc-theme" id="ccThemeCard" aria-label="主题">
            <div class="cc-theme-head">
              <div class="cc-theme-title">
                <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
                <div>
                  <p class="cc-tile-title">主题</p>
                  <span class="cc-theme-state" id="ccThemeState">浅色</span>
                </div>
              </div>
            </div>
            <div class="cc-segmented cc-theme-segment" id="ccThemeSegment">
              <button class="cc-segment-btn" type="button" data-theme="dark">深色</button>
              <button class="cc-segment-btn is-active" type="button" data-theme="light">浅色</button>
            </div>
          </article>

          <button class="cc-tile active" id="wifiToggleTile" type="button" aria-pressed="true">
            <div class="cc-tile-top">
              <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
              <span class="cc-toggle-dot" aria-hidden="true"></span>
            </div>
            <div>
              <p class="cc-tile-title">Wi-Fi</p>
              <span class="cc-tile-state">开</span>
            </div>
          </button>

          <button class="cc-tile active" id="btToggleTile" type="button" aria-pressed="true">
            <div class="cc-tile-top">
              <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5L17 17"/><path d="M6.5 17L17 6.5"/><path d="M12 3v18"/><path d="M12 3l5 4.5-5 4"/><path d="M12 13l5 4.5-5 3.5"/></svg>
              <span class="cc-toggle-dot" aria-hidden="true"></span>
            </div>
            <div>
              <p class="cc-tile-title">蓝牙</p>
              <span class="cc-tile-state">开</span>
            </div>
          </button>

          <div class="cc-slider" data-slider="brightness" role="slider" aria-label="屏幕亮度" aria-valuemin="0" aria-valuemax="100">
            <div class="cc-slider-track">
              <div class="cc-slider-fill"></div>
              <div class="cc-slider-thumb"></div>
            </div>
            <svg class="cc-slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.93 19.07l1.41-1.41"/><path d="M17.66 6.34l1.41-1.41"/></svg>
            <span class="cc-slider-label">屏幕亮度</span>
          </div>

          <div class="cc-slider" data-slider="volume" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100">
            <div class="cc-slider-track">
              <div class="cc-slider-fill"></div>
              <div class="cc-slider-thumb"></div>
            </div>
            <svg class="cc-slider-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="volumeIconPath" d="M11 5L6 9H3v6h3l5 4V5zm3.5 4.5a5 5 0 0 1 0 5m2.5-7.5a8.5 8.5 0 0 1 0 10"/></svg>
            <span class="cc-slider-label">音量</span>
          </div>
          <article class="cc-ambient" id="ccAmbientCard" aria-label="氛围灯">
            <div class="cc-ambient-head">
              <div class="cc-ambient-title">
                <svg class="cc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.75V16a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1.25A7 7 0 0 0 12 2z"/></svg>
                <div>
                  <p class="cc-tile-title">氛围灯</p>
                  <span class="cc-ambient-state" id="ambientStatusTextCc">关</span>
                </div>
              </div>
              <button class="cc-switch" id="ambientPowerToggleCc" type="button" role="switch" aria-checked="false" aria-label="氛围灯开关">
                <span class="cc-switch-knob"></span>
              </button>
            </div>

            <div class="cc-ambient-row" id="ambientBrightnessRow">
              <div class="cc-ambient-row-head">
                <span class="cc-ambient-label">亮度</span>
                <span class="cc-ambient-value"><span id="ambientBrightnessValueCc">60</span>%</span>
              </div>
              <input id="ambientBrightnessSliderCc" class="cc-range" type="range" min="0" max="100" step="1" value="60" aria-label="氛围灯亮度" />
            </div>

            <div class="cc-ambient-row" id="ambientModeRow">
              <div class="cc-ambient-row-head">
                <span class="cc-ambient-label">模式</span>
              </div>
              <div class="cc-segmented" id="ambientModeSegment">
                <button class="cc-segment-btn is-active" id="ambientModeSteadyBtn" type="button" data-mode="steady">常亮</button>
                <button class="cc-segment-btn" id="ambientModeBreathingBtn" type="button" data-mode="breathing">呼吸</button>
              </div>
              <p class="cc-ambient-note" id="ambientModeLockHint">开启同步后模式将被锁定。</p>
            </div>
          </article>

          <article class="cc-music playing" id="ccMusicCard" aria-label="音乐播放器">
            <div class="cc-music-head">
              <div class="cc-music-copy">
                <strong id="ccMusicTitle">夜间冲刺</strong>
                <span id="ccMusicArtist">脉冲律动</span>
              </div>
              <div class="cc-music-actions">
                <button class="cc-btn cc-btn--head" id="ccShuffleBtn" type="button" aria-label="随机播放">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="cc-btn cc-btn--head" id="ccPlaylistToggleBtn" type="button" aria-label="展开/收起播放列表" aria-expanded="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                </button>
              </div>
            </div>

            <div class="cc-progress-wrap">
              <span class="cc-progress-time" id="ccCurrentTime">00:48</span>
              <div class="cc-progress" aria-hidden="true">
                <div class="cc-progress-fill" id="ccProgressFill"></div>
              </div>
              <span class="cc-progress-time" id="ccTotalTime">03:20</span>
            </div>

            <div class="cc-controls">
              <button class="cc-btn" id="ccPrevBtn" type="button" aria-label="上一首">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zM18 6v12l-8-6z"/></svg>
              </button>
              <button class="cc-btn cc-btn--play" id="ccPlayBtn" type="button" aria-label="暂停">
                <svg id="ccPlayIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M8 5v14l11-7z"/></svg>
                <svg id="ccPauseIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
              </button>
              <button class="cc-btn" id="ccNextBtn" type="button" aria-label="下一首">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 6h2v12h-2zM6 6l8 6-8 6z"/></svg>
              </button>
            </div>

            <div class="cc-playlist is-collapsed" id="ccPlaylistPanel" aria-hidden="true">
              <ul class="cc-playlist-list" id="ccPlaylistList"></ul>
            </div>
          </article>
        </div>
      </div>
    </section>
    <button class="cc-fab" id="controlCenterFab" type="button" aria-label="打开控制中心">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-.4-1.1 1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2.8a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.1-.4 1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2.8a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 .4 1.1 1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c0 .39.14.77.4 1.06.29.31.68.49 1.1.5h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.1.44c-.27.3-.41.68-.4 1z"></path></svg>
    </button>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" id="homeTabBtn" type="button" aria-label="首页">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </span>
      </button>
      <button class="nav-item" id="allTrainingNavBtn" type="button" aria-label="全部训练">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>全部训练</span>
        </span>
      </button>
      <button class="nav-item" id="profileTabBtn" type="button" aria-label="我的">
        <span class="nav-item-inner">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </span>
      </button>
    </nav>

    <div class="training-modal" id="trainingTypeModal" aria-hidden="true">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="trainingTypeTitle">
        <div class="modal-head">
          <h3 id="trainingTypeTitle">选择训练类型</h3>
          <button class="close-btn" id="closeTrainingTypeModal" type="button" aria-label="关闭">✕</button>
        </div>
        <button class="training-btn" id="strengthTrainingBtn" type="button">
          <strong>力量训练</strong>
          <span>自由配重、阻力模式、详细数据</span>
        </button>
        <button class="training-btn" id="pilatesTrainingBtn" type="button">
          <strong>普拉提</strong>
          <span>核心控制与稳定</span>
        </button>
        <button class="training-btn" id="resistanceCardioBtn" type="button">
          <strong>阻力有氧</strong>
          <span>划船、滑雪等带阻力控制的有氧</span>
        </button>
      </div>
    </div>

  </main>
  <script src="js/data/explore-library.js"></script>
  <script src="js/plan-b-verify.js" defer></script>
  <script src="js/plan-b-control-center.js" defer></script>
  <script>
    window.__DEV_BACKUP__ = { apiOrigin: 'http://127.0.0.1:37547' };
  </script>
  <script src="http://127.0.0.1:37547/widget.js" defer></script>
</body>
</html>
