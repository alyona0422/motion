<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 计划详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-plan-detail.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
</head>
<body class="cream-medium" data-plan-b-page="plan-detail">
  <main class="device-shell" aria-label="Plan B 计划详情">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="plan-detail-screen" id="planDetailScreen" aria-label="计划详情">
      <div class="ad-top-row">
        <span>2024年12月6日 · 上午 10:26</span>
        <div class="ad-status-icons" aria-hidden="true">
          <span class="ad-status-dot"></span>
          <span class="ad-status-dot"></span>
          <span class="ad-status-dot"></span>
        </div>
      </div>
      <div class="ad-title-row plan-detail-title-row">
        <span class="ad-title-gap" aria-hidden="true"></span>
        <h2 class="ad-view-title">计划详情</h2>
        <span class="ad-title-gap" aria-hidden="true"></span>
      </div>

      <section class="plan-detail-cover-card" aria-label="计划封面">
        <img
          id="planDetailCover"
          class="plan-detail-cover"
          src="assets/card3.jpg"
          alt="计划封面"
          width="1200"
          height="675"
          decoding="async"
        />
      </section>

      <section class="plan-detail-headline" aria-label="计划概览">
        <h1 id="planDetailTitle">计划名称</h1>
        <p id="planDetailIntro">计划简介文本。</p>
        <div class="plan-detail-meta" aria-label="计划信息">
          <span class="plan-detail-meta-chip" id="planDetailSceneChip"><b>场景</b><span id="planDetailScene">力量训练</span></span>
          <span class="plan-detail-meta-chip" id="planDetailCycleChip"><b>周期</b><span id="planDetailCycle">2 周</span></span>
          <span class="plan-detail-meta-chip" id="planDetailSessionsChip"><b>每周次数</b><span id="planDetailSessions">3 次</span></span>
          <span class="plan-detail-meta-chip" id="planDetailDifficultyChip"><b>难度</b><span id="planDetailDifficulty">入门</span></span>
          <span class="plan-detail-meta-chip" id="planDetailPlanTypeChip" hidden><b>计划类型</b><span id="planDetailPlanType">个性化</span></span>
        </div>
      </section>

      <section class="plan-detail-schedule" aria-label="每周安排">
        <div class="plan-detail-section-head">
          <h3>每周安排</h3>
          <p id="planDetailScheduleHint">第 1 周 · 第 01 天</p>
        </div>
        <div class="plan-detail-week-tabs" id="planDetailWeekTabs" role="tablist" aria-label="周次标签"></div>
        <div class="plan-detail-day-tabs" id="planDetailDayTabs" role="tablist" aria-label="日期标签"></div>
        <div class="plan-detail-day-actions" id="planDetailDayActions" hidden>
          <button class="plan-detail-day-btn plan-detail-day-btn--skip" id="planDetailSkipDayBtn" type="button">跳过</button>
          <button class="plan-detail-day-btn plan-detail-day-btn--reschedule" id="planDetailRescheduleDayBtn" type="button">改期</button>
          <p class="plan-detail-day-action-hint" id="planDetailDayActionHint" hidden></p>
        </div>
      </section>

      <section class="plan-detail-moves" aria-label="动作列表">
        <div class="plan-detail-section-head">
          <h3>动作</h3>
          <p>每个动作均会显示组数、次数或时长，以及可选的配重。</p>
        </div>
        <div class="plan-detail-moves-list" id="planDetailMovesList"></div>
        <p class="plan-detail-empty" id="planDetailMovesEmpty" hidden>该训练日还未配置动作。</p>
      </section>

      <div class="plan-detail-actions" id="planDetailActions">
        <button class="plan-detail-action-btn plan-detail-more-btn" id="planDetailMoreBtn" type="button" hidden>更多</button>
        <button class="plan-detail-join-btn plan-detail-primary-btn" id="planDetailPrimaryBtn" type="button">加入计划</button>
      </div>
      <div class="action-dock" aria-label="页面操作">
        <button class="action-dock-back-btn" id="planDetailBackBtn" type="button" aria-label="返回">Back</button>
      </div>
    </section>

    <!-- Quit / Reset confirm dialog -->
    <div
      class="plan-detail-confirm-dialog"
      id="planDetailConfirmDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="planDetailConfirmText"
      aria-hidden="true"
    >
      <div class="plan-detail-confirm-backdrop" id="planDetailConfirmBackdrop"></div>
      <div class="plan-detail-confirm-panel">
        <p class="plan-detail-confirm-text" id="planDetailConfirmText"></p>
        <div class="plan-detail-confirm-actions">
          <button type="button" class="plan-detail-confirm-btn plan-detail-confirm-btn--cancel" id="planDetailConfirmCancel">取消</button>
          <button type="button" class="plan-detail-confirm-btn plan-detail-confirm-btn--ok" id="planDetailConfirmOk">确定</button>
        </div>
      </div>
    </div>

    <div
      class="plan-detail-calendar-dialog"
      id="planDayRescheduleDialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="planDayRescheduleTitle"
      aria-hidden="true"
    >
      <div class="plan-detail-calendar-backdrop" id="planDayRescheduleBackdrop"></div>
      <div class="plan-detail-calendar-panel">
        <div class="plan-detail-calendar-head">
          <h3 id="planDayRescheduleTitle">改期训练日</h3>
          <button class="plan-detail-calendar-close" id="planDayRescheduleCloseBtn" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <p class="plan-detail-calendar-desc">为该训练日选择新的日期。</p>
        <div class="plan-detail-calendar-weekdays" id="planDayRescheduleWeekdays"></div>
        <div class="plan-detail-calendar-grid" id="planDayRescheduleGrid"></div>
        <p class="plan-detail-calendar-hint" id="planDayRescheduleHint" hidden>该日期已安排训练计划。</p>
        <div class="plan-detail-calendar-actions">
          <button type="button" class="plan-detail-confirm-btn plan-detail-confirm-btn--cancel" id="planDayRescheduleCancel">取消</button>
          <button type="button" class="plan-detail-confirm-btn plan-detail-confirm-btn--ok" id="planDayRescheduleConfirm" disabled>确定</button>
        </div>
      </div>
    </div>

    <div class="plan-detail-more-sheet" id="planDetailMoreSheet" aria-hidden="true">
      <div class="plan-detail-more-backdrop" id="planDetailMoreBackdrop"></div>
      <div class="plan-detail-more-panel">
        <div class="plan-detail-more-head">
          <h3>更多操作</h3>
          <button class="plan-detail-more-close" id="planDetailMoreCloseBtn" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="plan-detail-more-actions">
          <button class="plan-detail-action-btn plan-detail-quit-btn" id="planDetailQuitBtn" type="button">退出计划</button>
          <button class="plan-detail-action-btn plan-detail-reset-btn" id="planDetailResetBtn" type="button">重置计划</button>
        </div>
      </div>
    </div>

    <!-- Join Plan Bottom Sheet -->
    <div class="plan-join-bottom-sheet" id="planJoinBottomSheet" aria-hidden="true">
      <div class="bottom-sheet-backdrop" id="planJoinBackdrop"></div>
      <div class="bottom-sheet-panel">
        <div class="bottom-sheet-header">
          <h3>选择训练日</h3>
          <button class="bottom-sheet-close" id="planJoinCloseBtn" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="bottom-sheet-body">
          <p class="bottom-sheet-desc">为你的训练选择 <strong id="planJoinMaxDays">3</strong> 天。</p>
          <div class="bottom-sheet-days" id="planJoinDaysList"></div>
          <p class="bottom-sheet-hint">后续每周都将沿用本周的训练安排。</p>
        </div>
        <div class="bottom-sheet-footer">
          <button class="plan-detail-join-btn" id="planJoinConfirmBtn" type="button" disabled>加入计划</button>
        </div>
      </div>
    </div>
  </main>
  <script src="js/data/explore-library.js"></script>
  <script src="js/plan-b-verify.js" defer></script>
  <script>
    window.__DEV_BACKUP__ = { apiOrigin: 'http://127.0.0.1:37547' };
  </script>
  <script src="http://127.0.0.1:37547/widget.js" defer></script>
</body>
</html>
