<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 重置密码</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-auth.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
</head>
<body class="cream-medium" data-plan-b-page="forgot-password">
  <main class="device-shell" aria-label="Plan B 忘记密码页">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="auth-screen" aria-label="重置密码">

      <section class="auth-card">
        <h1 class="auth-title">重置密码</h1>
        <p class="auth-subtitle">输入你的账号邮箱并设置新密码。</p>

        <div class="auth-form">
          <div class="auth-field">
            <label for="forgotEmail">邮箱</label>
            <input class="auth-input" id="forgotEmail" type="email" placeholder="name@email.com" />
          </div>

          <div class="auth-field">
            <label for="forgotCode">验证码</label>
            <div class="auth-input-row">
              <input class="auth-input" id="forgotCode" type="text" placeholder="6 位验证码" />
              <button class="auth-secondary-btn" type="button">发送验证码</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="forgotPassword">设置密码</label>
            <input class="auth-input" id="forgotPassword" type="password" placeholder="请输入新密码" />
          </div>

          <div class="auth-field">
            <label for="forgotConfirmPassword">确认密码</label>
            <input class="auth-input" id="forgotConfirmPassword" type="password" placeholder="请再次输入新密码" />
          </div>

          <button class="auth-primary-btn" id="forgotPasswordSaveBtn" type="button">保存修改</button>
        </div>
      </section>
      <div class="action-dock" aria-label="页面操作">
        <button class="action-dock-back-btn auth-back-btn" data-auth-back="plan-b-login.html" type="button" aria-label="返回">Back</button>
      </div>
    </section>

    <div class="auth-toast is-hidden" id="authToast" aria-live="polite"></div>
  </main>

  <script src="js/plan-b-auth.js" defer></script>
</body>
</html>
