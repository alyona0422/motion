<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan B · 登录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/plan-b-base.css" />
  <link rel="stylesheet" href="css/plan-b-modal-detail.css" />
  <link rel="stylesheet" href="css/plan-b-profile.css" />
  <link rel="stylesheet" href="css/plan-b-immersive.css" />
  <link rel="stylesheet" href="css/plan-b-pilates-report.css" />
  <link rel="stylesheet" href="css/plan-b-auth.css" />
  <link rel="stylesheet" href="css/plan-b-light-medium.css" />
</head>
<body class="cream-medium" data-plan-b-page="login">
  <main class="device-shell" aria-label="Plan B 登录页">
    <div class="particle-layer" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section class="auth-screen" aria-label="登录">

      <section class="auth-card">
        <h1 class="auth-title">欢迎回来</h1>
        <p class="auth-subtitle">继续你的 Plan B 训练进度。</p>

        <button class="quick-login-card" id="quickLoginBtn" type="button" aria-label="使用上次账号快捷登录">
          <div class="quick-login-avatar">A</div>
          <div class="quick-login-meta">
            <strong>Alyona</strong>
            <span>点击快捷登录</span>
          </div>
        </button>

        <div class="auth-separator">或使用账号登录</div>

        <div class="auth-method-tabs" role="tablist" aria-label="登录方式">
          <button class="auth-method-tab active" data-auth-method-tab="password" type="button">邮箱 + 密码</button>
          <button class="auth-method-tab" data-auth-method-tab="code" type="button">邮箱 + 验证码</button>
        </div>

        <div class="auth-form" data-auth-method-panel="password">
          <div class="auth-field">
            <label for="loginEmailPassword">邮箱</label>
            <input class="auth-input" id="loginEmailPassword" type="email" placeholder="name@email.com" />
          </div>
          <div class="auth-field">
            <label for="loginPassword">密码</label>
            <input class="auth-input" id="loginPassword" type="password" placeholder="请输入密码" />
          </div>
          <button class="auth-primary-btn" id="loginPasswordBtn" type="button">登录</button>
        </div>

        <div class="auth-form is-hidden" data-auth-method-panel="code">
          <div class="auth-field">
            <label for="loginEmailCode">邮箱</label>
            <input class="auth-input" id="loginEmailCode" type="email" placeholder="name@email.com" />
          </div>
          <div class="auth-field">
            <label for="loginCode">验证码</label>
            <div class="auth-input-row">
              <input class="auth-input" id="loginCode" type="text" placeholder="6 位验证码" />
              <button class="auth-secondary-btn" type="button">发送验证码</button>
            </div>
          </div>
          <button class="auth-primary-btn" id="loginCodeBtn" type="button">登录</button>
        </div>

        <label class="auth-check-row" for="loginPolicyAgree">
          <input id="loginPolicyAgree" type="checkbox" />
          <span>我已阅读并同意<a href="#" aria-label="用户协议">用户协议</a>与<a href="#" aria-label="隐私政策">隐私政策</a>。</span>
        </label>

        <div class="auth-foot-links">
          <button class="auth-link-btn" onclick="window.location.href='plan-b-forgot-password.html'" type="button">忘记密码？</button>
          <button class="auth-link-btn" onclick="window.location.href='plan-b-register.html'" type="button">创建账号</button>
        </div>
      </section>
      <div class="action-dock" aria-label="页面操作">
        <button class="action-dock-back-btn auth-back-btn" data-auth-back="plan-b-profile.html" type="button" aria-label="返回">Back</button>
      </div>
    </section>

    <div class="auth-toast is-hidden" id="authToast" aria-live="polite"></div>
  </main>

  <script src="js/plan-b-auth.js" defer></script>
</body>
</html>
